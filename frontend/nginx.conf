server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any route that isn't a real file.
    # This replaces the vercel.json rewrite / Render rewrite rule.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container.
    # The service name "backend" is resolved by the Compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health check for convenience
    location /health {
        proxy_pass http://backend:8080;
    }

    # Security headers (match vercel.json / render.yaml)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
